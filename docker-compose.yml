services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scan
      POSTGRES_PASSWORD: scan
      POSTGRES_DB: scan_legacy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scan -d scan_legacy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
